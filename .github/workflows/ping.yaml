name: Ping Health Checks

on:
  schedule:
    - cron: "*/12 * * * *"   # every 12 mins

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoints
        run: |
          for url in \
            https://last-call-gateway.onrender.com/health \
            https://last-call-item.onrender.com/health \
            https://last-call-room.onrender.com/health \
            https://last-call-dsto.onrender.com/health \
            https://last-call-user.onrender.com/health;
          do
            status=$(curl -o /dev/null -s -w "%{http_code}" $url)
            echo "$url -> $status"
          done
