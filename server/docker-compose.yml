services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: last_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      scheduler-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: last_call_user_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      JWT_SECRET: oA7iXP6Uz5uWF06YDExnoIyekDGnBqCK
    restart: unless-stopped

  item-service:
    build:
      context: ./item-service
      dockerfile: Dockerfile
    container_name: item-service
    depends_on:
      postgres:
        condition: service_healthy
      scheduler-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: last_call_item_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      CLOUDAMQP_URL: amqps://tvedsvug:k-0mPQ84l94C_Sg3I95qONez0pQXoMAM@cow.rmq2.cloudamqp.com/tvedsvug
    restart: unless-stopped

  room-service:
    build:
      context: ./room-service
      dockerfile: Dockerfile
    container_name: room-service
    depends_on:
      postgres:
        condition: service_healthy
      scheduler-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: last_call_room_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      CLOUDAMQP_URL: amqps://tvedsvug:k-0mPQ84l94C_Sg3I95qONez0pQXoMAM@cow.rmq2.cloudamqp.com/tvedsvug
    restart: unless-stopped

  scheduler-service:
    build:
      context: ./scheduler-service
      dockerfile: Dockerfile
    container_name: scheduler-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      CLOUDAMQP_URL: amqps://tvedsvug:k-0mPQ84l94C_Sg3I95qONez0pQXoMAM@cow.rmq2.cloudamqp.com/tvedsvug
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    depends_on:
      user-service:
        condition: service_started
      item-service:
        condition: service_started
      room-service:
        condition: service_started
      scheduler-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user-service:8081
      ITEM_SERVICE_URL: http://item-service:8082
      ROOM_SERVICE_URL: http://room-service:8083
      SCHEDULER_SERVICE_URL: http://scheduler-service:8084
      JWT_SECRET: oA7iXP6Uz5uWF06YDExnoIyekDGnBqCK
    restart: unless-stopped

volumes:
  postgres_data:
